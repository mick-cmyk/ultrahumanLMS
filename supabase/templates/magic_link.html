<!doctype html>
<html lang="en-AU">
<body style="margin:0;padding:0;background:#F6F4F0">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F4F0">
<tr><td align="center" style="padding:24px 12px">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0"
       style="max-width:560px;background:#ffffff;border-radius:12px;overflow:hidden;
              font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
  <tr><td style="padding:22px 28px;border-bottom:3px solid #ED4E05"><table role="presentation" cellpadding="0" cellspacing="0"><tr><td style="padding-right:10px;vertical-align:middle"><img src="https://lms.octolab.com.au/brand/octolab-logo.png" alt="" width="32" height="32" style="display:block;width:32px;height:32px;border:0"></td><td style="vertical-align:middle"><span style="font-size:15px;font-weight:bold;letter-spacing:.04em;color:#14161A">Octolab</span></td></tr></table></td></tr>
  <tr><td style="padding:28px">
    <h1 style="margin:0 0 18px;font-size:22px;color:#14161A">Your login link</h1>
    <p style="margin:0 0 16px;font-size:16px;line-height:1.55;color:#14161A">
      Tap the button to log in to Octolab. No password needed.
    </p>
    <table role="presentation" cellpadding="0" cellspacing="0" style="margin:8px 0 24px">
      <tr><td style="border-radius:6px;background:#ED4E05">
        <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=magiclink"
           style="display:inline-block;padding:14px 28px;font-size:16px;font-weight:bold;color:#14161a;text-decoration:none">
          Log in
        </a>
      </td></tr>
    </table>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#5A626E">
      Open it on the device you want to use. It works once and expires in an hour.
      If you didn't ask for it, you can ignore this email.
    </p>
  </td></tr>
  <tr><td style="padding:18px 28px;background:#F6F4F0;font-size:12px;line-height:1.5;color:#5A626E">
    The Octolab team
  </td></tr>
</table>
</td></tr></table>
</body>
</html>
